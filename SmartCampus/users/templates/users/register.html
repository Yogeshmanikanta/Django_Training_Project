<!DOCTYPE html>
<html>
	<head>
		<title>Register - Smart Campus</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background: #eef2f3;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}
			.register-container {
				background: white;
				padding: 30px;
				border-radius: 12px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
				width: 400px;
			}
			h2 {
				text-align: center;
				color: #333;
			}
			input,
			select {
				width: 100%;
				padding: 10px;
				margin-top: 10px;
				border: 1px solid #ccc;
				border-radius: 6px;
			}
			button {
				width: 100%;
				padding: 10px;
				background: #28a745;
				border: none;
				color: white;
				border-radius: 6px;
				margin-top: 15px;
				cursor: pointer;
			}
			button:hover {
				background: #218838;
			}
			.msg {
				color: red;
				text-align: center;
				font-size: 14px;
			}
			.links {
				text-align: center;
				margin-top: 10px;
			}
			a {
				text-decoration: none;
				color: #007bff;
			}
		</style>
	</head>
	<body>
		<div class="register-container">
			<h2>Create Account</h2>
			{% if messages %} {% for message in messages %}
			<p class="msg">{{ message }}</p>
			{% endfor %} {% endif %}

			<form method="POST">
				{% csrf_token %}
				<input type="text" name="username" placeholder="Username" required />
				<input type="email" name="email" placeholder="Email" required />
				<input
					type="password"
					name="password1"
					placeholder="Password"
					required
				/>
				<input
					type="password"
					name="password2"
					placeholder="Confirm Password"
					required
				/>

				<select name="role" required>
					<option value="">-- Select Role --</option>
					<option value="student">Student</option>
					<option value="faculty">Faculty</option>
				</select>

				<button type="submit">Register</button>
			</form>

			<div class="links">
				<p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
			</div>
		</div>
	</body>
</html>
