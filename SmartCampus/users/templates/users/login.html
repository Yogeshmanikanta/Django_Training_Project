<!DOCTYPE html>
<html>
	<head>
		<title>Login - Smart Campus</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background: #f0f4f8;
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh;
			}
			.login-container {
				background: white;
				padding: 30px;
				border-radius: 12px;
				box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
				width: 350px;
			}
			h2 {
				text-align: center;
				color: #333;
			}
			input {
				width: 100%;
				padding: 10px;
				margin-top: 10px;
				border: 1px solid #ccc;
				border-radius: 6px;
			}
			button {
				width: 100%;
				padding: 10px;
				background: #007bff;
				border: none;
				color: white;
				border-radius: 6px;
				margin-top: 15px;
				cursor: pointer;
			}
			button:hover {
				background: #0056b3;
			}
			.msg {
				color: red;
				text-align: center;
				font-size: 14px;
			}
			.links {
				text-align: center;
				margin-top: 10px;
			}
			a {
				text-decoration: none;
				color: #007bff;
			}
		</style>
	</head>
	<body>
		<div class="login-container">
			<h2>Login</h2>
			{% if messages %} {% for message in messages %}
			<p class="msg">{{ message }}</p>
			{% endfor %} {% endif %}

			<form method="post">
				{% csrf_token %}
				<input type="text" name="username" placeholder="Username" required />
				<input
					type="password"
					name="password"
					placeholder="Password"
					required
				/>
				<button type="submit">Login</button>
			</form>

			<div class="links">
				<p>
					Don’t have an account? <a href="{% url 'register' %}">Register</a>
				</p>
			</div>
		</div>
	</body>
</html>
