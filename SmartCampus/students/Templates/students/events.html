{% extends 'base.html' %} {% block content %}
<div class="container mx-auto mt-10">
	<h2 class="text-2xl font-bold text-pink-700 mb-4">📅 Event Scheduler</h2>

	<form method="post">
		{% csrf_token %}
		<input
			type="text"
			name="event_name"
			placeholder="Event Name"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<input
			type="datetime-local"
			name="event_time"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<button
			type="submit"
			class="bg-pink-600 text-white px-4 py-2 rounded-lg hover:bg-pink-700"
		>
			Add Event
		</button>
	</form>

	<h3 class="text-xl mt-6 mb-2">Upcoming Events:</h3>
	<ul>
		{% for event in events %}
		<li class="mb-2 bg-pink-100 p-3 rounded-lg">
			{{ event.event_name }} - {{ event.event_time }}
		</li>
		{% empty %}
		<p>No upcoming events.</p>
		{% endfor %}
	</ul>
</div>
{% endblock %}
