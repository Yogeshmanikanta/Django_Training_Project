{% extends 'base.html' %} {% block content %}
<div class="container mx-auto mt-10">
	<h2 class="text-2xl font-bold text-yellow-700 mb-4">🕵️ Lost & Found</h2>

	<form method="post">
		{% csrf_token %}
		<input
			type="text"
			name="item_name"
			placeholder="Item Name"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<textarea
			name="description"
			placeholder="Description"
			class="p-2 border rounded-lg w-full mb-2"
		></textarea>
		<button
			type="submit"
			class="bg-yellow-600 text-white px-4 py-2 rounded-lg hover:bg-yellow-700"
		>
			Report Lost Item
		</button>
	</form>

	<h3 class="text-xl mt-6 mb-2">Recent Lost Items:</h3>
	<ul>
		{% for item in items %}
		<li class="mb-2 bg-yellow-100 p-3 rounded-lg">
			<strong>{{ item.item_name }}</strong> - {{ item.description }}
		</li>
		{% empty %}
		<p>No lost items reported yet.</p>
		{% endfor %}
	</ul>
</div>
{% endblock %}
