{% extends 'base.html' %} {% block content %}
<div class="container mx-auto mt-10">
	<h2 class="text-2xl font-bold text-purple-700 mb-4">📊 Attendance Tracker</h2>

	<form method="post">
		{% csrf_token %}
		<input
			type="text"
			name="subject"
			placeholder="Subject"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<input
			type="number"
			name="attended_classes"
			placeholder="Attended Classes"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<input
			type="number"
			name="total_classes"
			placeholder="Total Classes"
			class="p-2 border rounded-lg w-full mb-2"
		/>
		<button
			type="submit"
			class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700"
		>
			Save Attendance
		</button>
	</form>

	<h3 class="text-xl mt-6 mb-2">Attendance Records:</h3>
	<ul>
		{% for a in attendance %}
		<li>{{ a.subject }} - {{ a.percentage }}%</li>
		{% empty %}
		<p>No attendance data yet.</p>
		{% endfor %}
	</ul>
</div>
{% endblock %}
